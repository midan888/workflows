name: Security audit publisher checks

on:
  push:
    paths:
      - .github/workflows/openrouter-security-audit.yml
      - .github/workflows/security-audit-checks.yml
      - tests/security-audit.test.cjs
  pull_request:
    paths:
      - .github/workflows/openrouter-security-audit.yml
      - .github/workflows/security-audit-checks.yml
      - tests/security-audit.test.cjs

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test the exact inline publisher with mocked GitHub APIs
        run: node --test tests/security-audit.test.cjs
